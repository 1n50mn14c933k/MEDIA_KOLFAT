name: Bug report
description: Report a reproducible MEDIA KOLFAT problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a MEDIA KOLFAT problem.

        Before submitting, remove personal data, private file paths, credentials and sensitive media. Do not disclose suspected security vulnerabilities here; use the private security process in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: MEDIA KOLFAT version
      description: Find the installed version in the application's About section.
      placeholder: e.g. Windows 2.0.0 or Linux Beta 2.4.0
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      description: Include Linux distribution and desktop environment if applicable.
      placeholder: e.g. Windows 11 24H2 or Ubuntu 26.04 GNOME
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Sources
        - Library
        - Organize
        - Settings
        - About
        - Installation / startup
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional screenshots, logs or additional context. Remove personal media, private paths, names and other sensitive information.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive information.
          required: true
