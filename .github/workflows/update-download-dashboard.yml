name: Update MEDIA KOLFAT downloads dashboard

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-download-dashboard.yml"
      - ".github/scripts/update_download_dashboard.py"

permissions:
  contents: write

concurrency:
  group: media-kolfat-download-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true # Required for current dashboard state push.
        with:
          persist-credentials: true # Needed for the existing dashboard state push; preserve scheduled updates.
      - name: Test multi-platform asset classification and historical migration
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_download_dashboard.py" -v
      - name: Collect real counters and render SVG
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -m py_compile .github/scripts/update_download_dashboard.py
          python3 .github/scripts/update_download_dashboard.py
          test -s assets/download-dashboard.svg
          test -s assets/download-dashboard-history.json
          grep -q "GitHub Downloads Dashboard" assets/download-dashboard.svg
          grep -q "WINDOWS" assets/download-dashboard.svg
          grep -q "LINUX" assets/download-dashboard.svg
          grep -q "macOS" assets/download-dashboard.svg
      - name: Commit refreshed dashboard only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/download-dashboard.svg assets/download-dashboard-history.json
          if git diff --cached --quiet; then
            echo "Dashboard already up to date"
            exit 0
          fi
          git commit -m "chore(stats): refresh Windows Linux macOS GitHub package dashboard"
          git push origin HEAD:main
