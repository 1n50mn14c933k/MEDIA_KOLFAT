name: Update MEDIA KOLFAT downloads dashboard

on:
  schedule:
    # Two off-peak opportunities per hour; missed GitHub schedule events remain possible.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-download-dashboard.yml"
      - ".github/scripts/update_download_dashboard.py"
      - ".github/scripts/tests/test_download_dashboard.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-download-dashboard.yml"
      - ".github/scripts/update_download_dashboard.py"
      - ".github/scripts/tests/test_download_dashboard.py"

permissions:
  contents: write

concurrency:
  group: media-kolfat-download-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - name: Test multi-platform asset classification and historical migration
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_download_dashboard.py" -v
      - name: Collect real counters and render SVG
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -m py_compile .github/scripts/update_download_dashboard.py
          python3 .github/scripts/update_download_dashboard.py
          test -s assets/download-dashboard.svg
          test -s assets/download-dashboard-history.json
          for platform in windows linux macos; do
            test -s "assets/download-count-${platform}.svg"
            grep -q 'DOWNLOADS' "assets/download-count-${platform}.svg"
          done
          grep -q "GitHub Downloads Dashboard" assets/download-dashboard.svg
          grep -q "WINDOWS" assets/download-dashboard.svg
          grep -q "LINUX" assets/download-dashboard.svg
          grep -q "macOS" assets/download-dashboard.svg
      - name: Commit refreshed dashboard only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/download-dashboard.svg assets/download-dashboard-history.json assets/download-count-windows.svg assets/download-count-linux.svg assets/download-count-macos.svg
          if git diff --cached --quiet; then
            echo "Dashboard already up to date"
            exit 0
          fi
          git commit -m "chore(stats): refresh Windows Linux macOS GitHub package dashboard"
          git push origin HEAD:main
