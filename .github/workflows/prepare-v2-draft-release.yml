name: Prepare MEDIA KOLFAT 2.0.0 draft release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-v2-draft-release.yml'

permissions:
  contents: write

jobs:
  create-release-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release without installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "v2.0.0 release already exists; leaving it unchanged"
            exit 0
          fi
          cat > "$RUNNER_TEMP/media-kolfat-v2-notes.md" <<'NOTES'
          # MEDIA KOLFAT 2.0.0 🎉

          **Platform:** Windows x64
          **Version:** 2.0.0
          **Price:** Free

          MEDIA KOLFAT helps organize photos, videos, and other files on Windows.

          ## Download

          **Direct installer:** `MEDIA_KOLFAT_2.0.0_Setup.exe` (attach in Assets before publishing).
          **SHA-256 checksum:** `MEDIA_KOLFAT_2.0.0_SHA256.txt` (attach in Assets before publishing).

          **Alternative:** [Microsoft Store](https://apps.microsoft.com/detail/9p0x091t7mv4).

          ## Security & privacy

          MEDIA KOLFAT is designed for local processing of user-managed media. This independent EXE installer is unsigned; Windows may display a SmartScreen or unknown-publisher warning. Download only from the official KOLFAT GitHub repository, and verify the SHA-256 checksum when the assets are attached.

          **Official website:** https://kolfat.app

          **MEDIA KOLFAT — ORDER FROM CHAOS.**
          NOTES
          gh release create v2.0.0 \
            --repo "$GH_REPO" \
            --target main \
            --draft \
            --title "MEDIA KOLFAT 2.0.0 🎉" \
            --notes-file "$RUNNER_TEMP/media-kolfat-v2-notes.md"
          gh release view v2.0.0 --repo "$GH_REPO" --json name,isDraft,tagName,url
