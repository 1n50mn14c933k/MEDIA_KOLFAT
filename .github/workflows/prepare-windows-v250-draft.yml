name: Prepare MEDIA KOLFAT 2.5.0 Windows draft (one-time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-windows-v250-draft.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-kolfat-v250-draft-preparation
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Replace only the What's New section of the existing unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/v250-whats-new.md" <<'CHANGELOG'
          ## ✨ What's New
          
          - 🧭 **Smarter Guided Mode:** Automatic media discovery, recommended folders, a Show All Folders option and fewer scanning steps.
          - 🖼️ **Better Library Browsing:** Improved folder and date navigation, filtering and media previews.
          - 🗂️ **Advanced Navigation:** Cleaner menus, improved folder management and smoother page transitions.
          - 📅 **Timeline:** Browse media by year, month and day, including Unknown Dates.
          - 🔍 **Advanced Search:** Combine folder, date, media-type and search filters.
          - 🏷️ **Smart Batch Renaming:** Rename multiple files with improved pattern controls and confirmations.
          - ⚙️ **Redesigned Settings:** Six organized categories for easier configuration.
          - 📦 **Safer COPY & MOVE:** Clearer readiness checks, improved collision handling and stronger Windows Advanced MOVE safeguards.
          - 📁 **Organization Improvements:** Better folder selection, organization patterns and operation feedback.
          - 📊 **HTML Reports:** Readable offline reports alongside TXT and existing JSON/CSV exports.
          - ➡️ **Navigation Fixes:** More reliable Next buttons and Guided/Advanced workflow transitions.
          - 🌍 **Localization:** Refinements for English, German, Spanish and Persian (RTL).
          - ✨ **UI & Reliability:** More consistent controls, compact layouts, clearer confirmations and bug fixes.
          
          *Windows 2.5.0 is a separate release from the Linux and macOS 2.4.0 Public Betas.*
          CHANGELOG
          python3 - "$RUNNER_TEMP/v250-whats-new.md" "$RUNNER_TEMP/v250-notes.md" <<'PY'
          import json, pathlib, subprocess, sys
          new_section = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').rstrip()
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/1n50mn14c933k/MEDIA_KOLFAT/releases/451187190'], text=True))
          assert release['draft'] is True, 'Refusing to edit a published release'
          assert release['tag_name'] == 'v2.5.0'
          assert release['name'] == 'MEDIA KOLFAT 2.5.0 | Windows 🪟'
          body = release['body'].replace('\r\n', '\n')
          start_marker = '## ✨ What\'s New'
          end_marker = '\n---\n\n## ⬇️ Download MEDIA KOLFAT'
          assert body.count(start_marker) == 1 and body.count(end_marker) == 1, 'Release layout unexpectedly changed'
          start = body.index(start_marker)
          end = body.index(end_marker, start)
          original_section = body[start:end]
          assert 'Smart Batch Renaming' in original_section or 'Smarter Guided Media Discovery' in original_section, 'Unexpected prior release content'
          updated = body[:start] + new_section + '\n' + body[end:]
          pathlib.Path(sys.argv[2]).write_text(updated, encoding='utf-8')
          print('Previous bullets:', original_section.count('\n- '))
          print('Updated bullets:', new_section.count('\n- '))
          print('Release draft:', release['id'])
          PY
          gh release edit v2.5.0 -R "$GH_REPO" --notes-file "$RUNNER_TEMP/v250-notes.md"
          gh api "repos/$GH_REPO/releases/451187190" >"$RUNNER_TEMP/v250-verify.json"
          jq -e '.draft == true and .prerelease == false and .name == "MEDIA KOLFAT 2.5.0 | Windows 🪟" and (.body | contains("### ⚙️ Redesigned Settings") and contains("### 🏷️ Smart Batch Renaming") and contains("### 📦 Safer COPY, MOVE & Organization") and contains("### 📊 Reports & Results") and contains("### 🛡️ Quality & Compatibility"))' "$RUNNER_TEMP/v250-verify.json"
          echo 'PASS: Expanded changelog saved to the existing draft; old releases and assets untouched.'
