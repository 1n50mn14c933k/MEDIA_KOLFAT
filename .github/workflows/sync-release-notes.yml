name: Sync MEDIA KOLFAT release notes

on:
  push:
    branches: [main]
    paths:
      - 'release-notes/v*.md'
      - '.github/workflows/sync-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-kolfat-release-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check published releases and note files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.2.0 v1.4.0 v1.6.0 v2.0.0; do
            test -s "release-notes/${tag}.md"
            gh release view "$tag" --repo "$GH_REPO" >/dev/null
          done
          test -s "release-notes/v1.8.0.md"
          name="$(gh api "repos/$GH_REPO/releases/417370501" --jq '.name')"
          [[ "$name" == "MEDIA KOLFAT 1.8.0 🎉" ]] || exit 1

      - name: Update all six live release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.2.0 v1.4.0 v1.6.0 v2.0.0; do
            gh release edit "$tag" --repo "$GH_REPO" --notes-file "release-notes/${tag}.md"
            echo "Updated $tag"
          done
          gh api --method PATCH "repos/$GH_REPO/releases/417370501" \
            --raw-field "body=$(cat release-notes/v1.8.0.md)" >/dev/null
          echo "Updated v1.8.0 by existing release ID"

      - name: Verify all six release descriptions, dates and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.2.0 v1.4.0 v1.6.0 v2.0.0; do
            expected="$(cat "release-notes/${tag}.md")"
            actual="$(gh release view "$tag" --repo "$GH_REPO" --json body --jq '.body')"
            [[ "$expected" == "$actual" ]] || { echo "Mismatch $tag"; exit 1; }
            [[ "$actual" != *"### ⚠️ Important"* ]] || exit 1
            echo "Verified $tag"
          done
          expected="$(cat release-notes/v1.8.0.md)"
          actual="$(gh api "repos/$GH_REPO/releases/417370501" --jq '.body')"
          [[ "$expected" == "$actual" ]] || { echo "Mismatch v1.8.0"; exit 1; }
          [[ "$actual" != *"### ⚠️ Important"* ]] || exit 1
          echo "Verified v1.8.0"
          test "$(gh release view v2.0.0 --repo "$GH_REPO" --json assets --jq '[.assets[].name] | index("MEDIA_KOLFAT_2.0.0_Setup.exe") != null')" = true
          test "$(gh release view v2.0.0 --repo "$GH_REPO" --json assets --jq '[.assets[].name] | index("MEDIA_KOLFAT_2.0.0_SHA256.txt") != null')" = true
          echo 'All six release descriptions match; v2.0.0 installer and checksum remain attached.'
