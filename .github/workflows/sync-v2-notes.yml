name: Sync MEDIA KOLFAT 2.0.0 draft release notes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-v2-notes.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply v2.0.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0 --repo "$GITHUB_REPOSITORY" --notes-file release-notes/v2.0.0.md
