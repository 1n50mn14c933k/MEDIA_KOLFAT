name: Publish MEDIA KOLFAT Linux Beta announcement

on:
  push:
    branches: [main]
    paths:
      - 'release-notes/v2.4.0-linux-beta.md'
      - '.github/workflows/publish-linux-beta-announcement.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish distinct Linux prerelease without binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v2.4.0-linux-beta'
          notes='release-notes/v2.4.0-linux-beta.md'
          test -s "$notes"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GH_REPO" --title '🐧 MEDIA KOLFAT 2.4.0 for Linux | Public Beta' --notes-file "$notes" --prerelease
            echo "Updated existing 2.4.0 Linux beta notes without modifying assets."
          else
            gh release create "$tag" --repo "$GH_REPO" --target main --title '🐧 MEDIA KOLFAT 2.4.0 for Linux | Public Beta' --notes-file "$notes" --prerelease
          fi
          gh release view "$tag" --repo "$GH_REPO" --json tagName,isPrerelease,name --jq '{tag:.tagName,prerelease:.isPrerelease,name:.name}'
          [[ "$(gh release view "$tag" --repo "$GH_REPO" --json name --jq .name)" == '🐧 MEDIA KOLFAT 2.4.0 for Linux | Public Beta' ]] || exit 1
          [[ "$(gh release view "$tag" --repo "$GH_REPO" --json isPrerelease --jq .isPrerelease)" == true ]] || exit 1
          echo "Confirmed correct Linux 2.4.0 title and pre-release state."
