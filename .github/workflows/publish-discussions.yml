name: Publish MEDIA KOLFAT Discussion starters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'discussion-starters/**'
      - '.github/workflows/publish-discussions.yml'
      - '.github/scripts/publish_discussions.py'

permissions:
  contents: read
  discussions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create missing discussion starters
        env:
          GH_TOKEN: ${{ secrets.DISCUSSIONS_PUBLISH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Discussions authentication."
            exit 1
          fi
          python3 .github/scripts/publish_discussions.py
